# input = "${REPO_ROOT}/inputs/rmat-20M.wea"
# # input = "${REPO_ROOT}/inputs/USA-road-d-USA.sym.wag"

[benchmarks.sa]
algorithm = "par-range"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.bw]
algorithm = "list-rank"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.lrs]
algorithm = "doubling"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

